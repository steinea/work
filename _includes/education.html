<p>
  {% assign sorted = site.pages | sort: "ended" | reverse %}
  {% for item in sorted %}
    {% if item.category contains "education" %}
      {{ item.ended | date: '%Y' }} {% if item.link %}<a href="{{ item.link }}">{% endif %}{{ item.type }} {{ item.title }}{% if item.link %}</a>{% endif %}<br>
    {% endif %}
  {% endfor %}
</p>
