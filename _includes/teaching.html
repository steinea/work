<p>
  {% assign sorted = site.pages | sort: "date" | reverse %}
  {% for item in sorted %}
    {% if item.category contains "scholarship" and item.subcategory contains "course-taught" %}
      {{ item.semester }}{{ item.date | date: '%y' }} <a href="{{ item.link }}">{{ item.subtitle }}</a><br>
    {% endif %}
  {% endfor %}
</p>
